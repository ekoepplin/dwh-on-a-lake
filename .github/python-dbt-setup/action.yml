name: 'Python-DBT Setup'
description: 'Sets up Python with uv, installs dependencies, and configures dbt for MotherDuck'

inputs:
  motherduck-token:
    description: 'MotherDuck authentication token'
    required: true
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Install dependencies
      run: uv sync
      shell: bash

    - name: Cache dbt packages
      uses: actions/cache@v4
      with:
        path: transformation/dbt_packages
        key: dbt-packages-${{ hashFiles('transformation/packages.yml') }}

    - name: Install dbt dependencies
      run: |
        cd transformation
        uv run dbt deps
      shell: bash

    - name: Set up MotherDuck
      run: echo "MOTHERDUCK_TOKEN=${{ inputs.motherduck-token }}" >> $GITHUB_ENV
      shell: bash