# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "**" ]  # Trigger on push to any branch (including merges)
  pull_request:
    branches: [ "**" ]  # Trigger on PRs to any branch

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install uv
      uses: astral-sh/setup-uv@v4
    - name: Install dependencies
      run: |
        uv sync
    - name: Lint with flake8
      run: |
        uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        uv run pytest --ignore=.venv || true
    - name: Verify dbt project compiles
      run: |
        cd transformation
        uv run dbt deps
        uv run dbt compile --target dev
    - name: Run dbt tests (dry-run)
      run: |
        cd transformation
        uv run dbt test --target dev || echo "Note: dbt tests require data. Run full tests locally."
