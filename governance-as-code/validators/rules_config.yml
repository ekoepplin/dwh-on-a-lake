# Governance Validation Rules Configuration
# 
# This file defines which validation rules are enabled and their settings.
# Rule functions are defined in rules.py, but their configuration is here.
#
# Retention and deletion policies are defined in ../policies/retention_policies.yml

rules:
  # Metadata validation rules
  - name: "No metadata found for the following models"
    func: "detect_models_with_empty_metadata"
    severity: "error"
    enabled: true
    description: "Ensures all models have metadata defined"
  
  - name: "Invalid metadata definition for the following models"
    func: "detect_models_with_invalid_metadata"
    severity: "error"
    enabled: true
    description: "Validates metadata against standard schema"
  
  # File structure validation rules
  - name: "Models without corresponding SQL files"
    func: "detect_models_without_sql_file"
    severity: "warning"
    enabled: true
    description: "Warns when a model in YAML has no corresponding SQL file"
  
  # Column validation rules
  - name: "Column mismatches between SQL and YAML"
    func: "detect_column_mismatches"
    severity: "error"
    enabled: true
    description: "Ensures SQL columns match YAML column definitions"
  
  # PII and Retention validation rules
  - name: "PII models without retention_days specified"
    func: "detect_pii_without_retention_days"
    severity: "error"
    enabled: true
    description: "Ensures all PII models have pii_retention_days specified"
  
  - name: "Invalid retention periods for PII data"
    func: "detect_invalid_retention_periods"
    severity: "error"
    enabled: true
    description: "Validates that retention periods meet policy requirements (min/max days)"
  
  - name: "PII models without retention_date_field"
    func: "detect_pii_without_retention_date_field"
    severity: "error"
    enabled: true
    description: "Ensures PII models have a column marked as retention_date_field for tracking retention expiry"
  
  - name: "PII columns without anonymization_method"
    func: "detect_pii_without_anonymization_method"
    severity: "error"
    enabled: true
    description: "Ensures all PII columns specify an anonymization_method for data deletion/anonymization"

