version: 2

models:
  - name: int_newsapi__articles
    description: "Simple intermediate model that enriches articles with date and topic categorization"
    columns:
      - name: source_name
        description: "Name of the news source"
      - name: author
        description: "Article author"
      - name: title
        description: "Article title"
      - name: article_date
        description: "Date of article publication"
      - name: topic_category
        description: "Categorized topic: Microsoft Copilot, Microsoft, AI, Tech, Startups, or Other"
      - name: is_copilot_related
        description: "Boolean flag indicating if article is about Microsoft Copilot"
      - name: is_microsoft_related
        description: "Boolean flag indicating if article is about Microsoft"
      - name: is_ai_related
        description: "Boolean flag indicating if article is AI-related"
