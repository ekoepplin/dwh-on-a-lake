version: 2

sources:
  - name: newsapi_ducklake
    description: "Source data from DuckLake (dlt ingestion with ACID merge)"
    database: "{{ 'newsapi_lake' if target.name == 'dev' else 'newsapi_ducklake' }}"
    schema: ingest_newsapi_v1
    meta:
      owner: "data_engineering_team"
      source_system: "NewsAPI"
      storage_format: "DuckLake (Parquet + ACID catalog)"
      data_contract:
        version: "1.0"
        owner: "external_vendor"
      sla_requirements:
        freshness: "24 hours"
        completeness: "98%"
      contact_info:
        slack_channel: "#data-newsapi-support"
        team_email: "data-team@company.com"
    tables:
      - name: articles_us_en
        description: "Raw articles ingested from NewsAPI, deduplicated via merge on URL"
