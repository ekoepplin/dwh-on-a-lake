version: 2

models:
  - name: mart_newsapi__daily_articles
    description: "Daily article counts aggregated from news articles"
    meta:
      # Standardized metadata using governance schema
      data_governance:
        business_owner: "alice@company.com"
        team_owner: "data-team"
        data_classification: "PUBLIC"
        data_lifecycle: "PRODUCTION"
        has_pii: false
        can_be_referenced: true
        update_schedule: "daily"
        sla: "daily"
      # Legacy metadata (can be kept for backward compatibility)
      owner: "data_team_name"
      business_domain: "content"
      priority: "high"
      business_terms:
        article_date: "The date when articles were published"
        article_count: "Number of articles published on a given date"
      upstream_dependencies:
        - "int_newsapi__articles"
      data_category: "news_analytics"
    contract:
      enforced: false
    columns:
      - name: article_date
        description: "The date when articles were published"
        data_type: date
        tests:
          - not_null
          - unique
      - name: article_count
        description: "Number of articles published on a given date"
        data_type: integer
        tests:
          - not_null
          - positive_value
