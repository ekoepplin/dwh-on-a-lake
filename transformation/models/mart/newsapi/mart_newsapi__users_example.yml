version: 2

models:
  - name: mart_newsapi__users_example
    description: "Example model with PII data (for demonstration)"
    meta:
      data_governance:
        business_owner: "bob@company.com"
        team_owner: "analytics-team"
        data_classification: "CONFIDENTIAL"
        data_lifecycle: "PRODUCTION"
        has_pii: true
        pii_retention_days: 365
        can_be_referenced: false
        update_schedule: "hourly"
        sla: "1 hour"
    columns:
      - name: user_id
        description: "User identifier"
        data_type: string
        meta:
          data_governance:
            is_pii: true
            pii_type: "identifier"
            anonymization_method: "pseudonymize"  # Replace with pseudonym
      - name: email
        description: "User email address"
        data_type: string
        meta:
          data_governance:
            is_pii: true
            pii_type: "email"
            anonymization_method: "hash_with_salt"  # Hash email with salt
      - name: created_at
        description: "Account creation date"
        data_type: timestamp
        meta:
          data_governance:
            retention_date_field: true  # Used to calculate retention expiry

