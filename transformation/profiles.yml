dwh-on-a-lake-profile:
  outputs:
    dev:
      type: duckdb
      path: ":memory:"
      extensions:
        - ducklake
      attach:
        - path: /tmp/newsapi_ducklake_catalog.duckdb
          alias: newsapi_lake
          type: ducklake
          is_ducklake: true
          options:
            data_path: /tmp/newsapi_ducklake_data/
      schema: dbt_dev
      threads: 4

    motherduck:
      type: duckdb
      path: "md:?motherduck_token={{ env_var('MOTHERDUCK_TOKEN') }}"
      schema: dbt_prod
      is_ducklake: true
      threads: 4

  target: dev
